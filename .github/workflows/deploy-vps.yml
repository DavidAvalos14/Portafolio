name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pull latest changes on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd ${{ secrets.VPS_APP_DIR }}
            git fetch origin main
            git reset --hard origin/main
            DEPLOY_SHA=$(git rev-parse --short HEAD)
            echo "Deploying commit: ${DEPLOY_SHA}"

            # Cache-busting for static assets in HTML files.
            find . -type f -name "*.html" -exec sed -i -E \
              "s#(assets/css/style\.css)(\?v=[^\"']*)?#\\1?v=${DEPLOY_SHA}#g; s#(assets/js/main\.js)(\?v=[^\"']*)?#\\1?v=${DEPLOY_SHA}#g; s#(\.\./js/main\.js)(\?v=[^\"']*)?#\\1?v=${DEPLOY_SHA}#g; s#(assets/docs/DavidAvalos_CV\.pdf)(\?v=[^\"']*)?#\\1?v=${DEPLOY_SHA}#g" {} +
